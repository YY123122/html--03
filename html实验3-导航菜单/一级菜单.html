<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>一级菜单</title>
    <style>
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .nav>li {
            display: inline-block;
            padding: 12px 20px;
            border: 1px solid #ccc;
            margin: 0 2px;
        }
        .nav a {
            text-decoration: none;
            color: #000;
        }
        .nav>li:hover {
            background-color: #4472C4;
        }
        .nav>li:hover a {
            color: #fff;
        }
    </style>
</head>
<body>
<ul class="nav">
    <li><a href="#">首页</a></li>
    <li><a href="#">教学院(部)</a></li>
    <li><a href="#">党群机构</a></li>
    <li><a href="#">行政教辅机构</a></li>
    <li><a href="#">教学科研</a></li>
    <li><a href="#">招生就业</a></li>
    <li><a href="#">国际交流</a></li>
    <li><a href="#">数字图书馆</a></li>
</ul>
</body>
</html>
