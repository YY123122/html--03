<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>二级菜单</title>
    <style>
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .nav > li {
            display: inline-block;
            position: relative;
            padding:12px 20px;
            border:1px solid #ccc;
            margin:0 2px;
        }
        .nav a{
            text-decoration: none;
            color:#000;
        }
        .nav li ul {
            display: none;
            position: absolute;
            left:0;
            top:100%;
            background:#fff;
            border:1px solid #ccc;
        }
        .nav li ul li{
            padding:10px 16px;
            white-space: nowrap;
        }
        .nav > li:hover{
            background-color:#4472C4;
        }
        .nav > li:hover a{
            color:#fff;
        }
        .nav > li:hover > ul{
            display:block;
        }
        .nav li ul li:hover{
            background:#88a8e0;
        }
    </style>
</head>
<body>
欢迎访问湖南文理学院
<ul class="nav">
    <li><a href="#">首页</a></li>
    <li>
        <a href="#">教学院(部)</a>
        <ul>
            <li><a href="#">计算机与电气工程学院</a></li>
            <li><a href="#">芙蓉学院</a></li>
        </ul>
    </li>
    <li><a href="#">党群机构</a></li>
    <li><a href="#">行政教辅机构</a></li>
    <li><a href="#">教学科研</a></li>
    <li><a href="#">招生就业</a></li>
    <li><a href="#">国际交流</a></li>
    <li><a href="#">数字图书馆</a></li>
</ul>
</body>
</html>
